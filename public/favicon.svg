<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Leaf Gradients -->
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d5239" />
      <stop offset="60%" stop-color="#1b3824" />
      <stop offset="100%" stop-color="#0f2215" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#345e42" />
      <stop offset="60%" stop-color="#1e3d28" />
      <stop offset="100%" stop-color="#122417" />
    </linearGradient>

    <!-- Outer Petal Gradients (Porcelain ivory with soft warm parchment shadow) -->
    <radialGradient id="outerPetalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8f4ec" />
      <stop offset="100%" stop-color="#ebdcc9" />
    </radialGradient>

    <!-- Mid Petal Gradients -->
    <linearGradient id="midPetalGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f6efe1" />
      <stop offset="100%" stop-color="#e3d0ba" />
    </linearGradient>

    <!-- Rosette Core Warmth (Golden honey / buttery glow deep in folds) -->
    <radialGradient id="coreGlow" cx="48%" cy="52%" r="45%">
      <stop offset="0%" stop-color="#faedd7" />
      <stop offset="50%" stop-color="#f2dcbc" />
      <stop offset="100%" stop-color="#cca87d" />
    </radialGradient>

    <!-- Drop Shadow for layered petal relief -->
    <filter id="petalShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0.5" dy="1.5" stdDeviation="1.5" flood-color="#54381e" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Deep Evergreen Gardenia Foliage (Dark Glossy Leaves) -->
  <g class="gardenia-leaves">
    <!-- Top-Right Leaf -->
    <path d="M78 40 C92 22 110 12 122 20 C125 36 112 58 92 56 Z" fill="url(#leafGrad1)" stroke="#0e1f13" stroke-width="1.2" />
    <path d="M82 38 Q102 26 118 22" stroke="#487856" stroke-width="1.2" fill="none" opacity="0.75" />
    <path d="M92 34 Q98 28 104 26 M98 38 Q106 34 112 30 M88 42 Q94 44 98 48" stroke="#487856" stroke-width="0.8" fill="none" opacity="0.55" />

    <!-- Bottom-Left Leaf -->
    <path d="M48 84 C30 102 12 112 4 102 C0 84 18 66 38 72 Z" fill="url(#leafGrad2)" stroke="#0e1f13" stroke-width="1.2" />
    <path d="M44 80 Q24 94 8 100" stroke="#487856" stroke-width="1.2" fill="none" opacity="0.75" />
    <path d="M34 82 Q28 88 22 90 M24 78 Q18 80 12 86 M38 90 Q34 96 28 100" stroke="#487856" stroke-width="0.8" fill="none" opacity="0.55" />

    <!-- Top-Left Leaf Tip -->
    <path d="M46 42 C28 30 16 14 26 6 C40 8 52 26 48 42 Z" fill="url(#leafGrad1)" stroke="#0e1f13" stroke-width="1.2" />
    <path d="M44 38 Q32 20 28 10" stroke="#487856" stroke-width="1" fill="none" opacity="0.65" />

    <!-- Bottom-Right Leaf Tip -->
    <path d="M86 80 C104 94 118 106 122 96 C124 82 108 68 92 72 Z" fill="url(#leafGrad2)" stroke="#0e1f13" stroke-width="1.2" />
    <path d="M90 76 Q108 88 118 94" stroke="#487856" stroke-width="1" fill="none" opacity="0.65" />
  </g>

  <!-- Gardenia Blossom (Double Whorled Corolla) -->
  <g class="gardenia-corolla" filter="url(#petalShadow)">
    <!-- Layer 1: Outermost Broad Undulating Petals -->
    <!-- Top Apex Petal -->
    <path d="M42 46 C34 26 48 10 62 8 C76 10 90 24 82 46 C74 42 54 42 42 46 Z"
          fill="url(#outerPetalGrad)" stroke="#cbb49c" stroke-width="0.9" />

    <!-- Top-Right Flank Petal -->
    <path d="M80 44 C96 32 115 42 118 56 C120 72 102 82 84 74 C78 62 78 50 80 44 Z"
          fill="url(#outerPetalGrad)" stroke="#cbb49c" stroke-width="0.9" />

    <!-- Bottom-Right Broad Petal -->
    <path d="M80 72 C94 88 98 108 82 116 C68 120 54 112 52 92 C62 86 72 82 80 72 Z"
          fill="url(#outerPetalGrad)" stroke="#cbb49c" stroke-width="0.9" />

    <!-- Bottom-Left Rounded Petal -->
    <path d="M52 90 C36 110 16 108 10 92 C6 78 22 66 42 70 C44 78 48 86 52 90 Z"
          fill="url(#outerPetalGrad)" stroke="#cbb49c" stroke-width="0.9" />

    <!-- Left Flank Broad Petal -->
    <path d="M42 68 C20 64 6 46 14 30 C24 18 42 26 46 46 C42 52 40 62 42 68 Z"
          fill="url(#outerPetalGrad)" stroke="#cbb49c" stroke-width="0.9" />

    <!-- Layer 2: Intermediate Whorl Petals (Curling & Cupping) -->
    <!-- Mid Petal Upper-Right -->
    <path d="M60 40 C76 34 94 44 92 60 C90 72 74 72 64 66 C60 54 58 44 60 40 Z"
          fill="url(#midPetalGrad)" stroke="#c2a78d" stroke-width="0.8" />

    <!-- Mid Petal Lower-Right -->
    <path d="M68 64 C82 68 88 84 80 96 C70 104 58 96 54 82 C58 74 64 68 68 64 Z"
          fill="url(#midPetalGrad)" stroke="#c2a78d" stroke-width="0.8" />

    <!-- Mid Petal Lower-Left -->
    <path d="M54 80 C42 90 28 82 30 70 C32 58 46 56 52 64 C52 70 52 76 54 80 Z"
          fill="url(#midPetalGrad)" stroke="#c2a78d" stroke-width="0.8" />

    <!-- Mid Petal Upper-Left -->
    <path d="M50 60 C38 52 44 36 56 34 C68 34 70 48 60 56 C56 56 52 58 50 60 Z"
          fill="url(#midPetalGrad)" stroke="#c2a78d" stroke-width="0.8" />

    <!-- Layer 3: Inner Rosette Petals (Tight Spiral Whorl) -->
    <!-- Inner Cup Upper -->
    <path d="M56 48 C66 44 76 50 74 60 C72 68 62 66 58 60 Z"
          fill="url(#coreGlow)" stroke="#b89878" stroke-width="0.75" />

    <!-- Inner Cup Lower-Right -->
    <path d="M64 58 C72 62 70 72 60 74 C54 74 52 66 56 60 Z"
          fill="url(#coreGlow)" stroke="#b89878" stroke-width="0.75" />

    <!-- Inner Cup Lower-Left -->
    <path d="M55 64 C48 66 46 58 52 52 C56 48 62 50 60 58 Z"
          fill="url(#coreGlow)" stroke="#b89878" stroke-width="0.75" />

    <!-- Core Center Spiral Swirl -->
    <path d="M57 53 C61 51 65 54 64 58 C62 62 57 62 56 59 C54 56 56 54 57 53 Z"
          fill="#edd1a8" stroke="#a58058" stroke-width="0.7" />
    <path d="M59 55 C61 54 63 56 62 58 C61 60 59 60 58 58 Z"
          fill="#d4ae7c" stroke="#8d663e" stroke-width="0.5" />
  </g>
</svg>